server {
    listen 9002;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not include port or absolute scheme in redirects behind Cloudflare Tunnel
    port_in_redirect off;
    absolute_redirect off;

    # Long-cache the immutable hashed build assets.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Portal subdomains served from the SAME admin static build (mirrors the
    # prod CloudFront subdomain rewrites). Only the root path is rewritten;
    # deeper paths (/htx/*, /kol-portal/*, /_next/*, assets) fall through, and
    # admin.* serves the admin root unchanged.
    #   htx.<domain>  → /htx               (bare entry redirects to login/dashboard)
    #   kol.<domain>  → /kol-portal/login  (no bare entry → land on login)
    #   daily.<domain>→ /agent-portal/login (đại lý đặt hộ portal; no bare entry → login)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        if ($host ~* ^htx\.) { rewrite ^ /htx/ last; }
        if ($host ~* ^kol\.) { rewrite ^ /kol-portal/login/ last; }
        if ($host ~* ^daily\.) { rewrite ^ /agent-portal/login/ last; }
        try_files /index.html =404;
    }

    # Next.js App Router RSC payload files (*.txt / index.txt).
    # If a browser navigates directly to index.txt (e.g. Next.js hard-navigation fallback on error,
    # or WebView reload while on index.txt URL), redirect back to the page directory so that
    # index.html is loaded instead of rendering raw RSC text.
    location ~* /index\.txt$ {
        if ($http_accept ~* "text/html") {
            rewrite ^(.*)/index\.txt$ $1/ redirect;
        }
        types {
            text/x-component txt;
        }
        default_type text/x-component;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Next static export (trailingSlash: true): serve the exact file, then the
    # directory's index.html, then the .html variant, else SPA-fallback to
    # index.html — mirrors the prod S3 ErrorDocument=index.html behaviour so
    # client-side routes / dynamic [id] pages resolve.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ $uri.html /index.html;
    }
}
